name = "OSforGFFComparator"
version = "0.1.0"
defaultTargets = ["Challenge", "Solution"]

# The substantive development. Mathlib reaches the workspace through it, which is
# what lets Challenge.lean import Mathlib while importing no project source.
[[require]]
name = "OSforGFF"
git = "https://github.com/cherkis/OSforGFFgeneral.git"
rev = "6a9ea5315e9e89be5db6e93cb6d8752bd91d0936"

# The auditable statement: Mathlib-only imports, one `sorry` per advertised declaration.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

# The same declarations, proved from OSforGFF.
[[lean_lib]]
name = "Solution"
roots = ["Solution"]
