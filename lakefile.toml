name = "OSforGFFComparator"
version = "0.1.0"
defaultTargets = ["Challenge", "Solution"]

# The substantive development. Mathlib reaches the workspace through it, which is
# what lets Challenge.lean import Mathlib while importing no project source.
[[require]]
name = "OSforGFF"
git = "https://github.com/mrdouglasny/OSforGFF.git"
rev = "bef76a68dc9f483a6fe3f405bcf5f2cc467b92b8"

# The auditable statement: Mathlib-only imports, one `sorry` per advertised declaration.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

# The same declarations, proved from OSforGFF.
[[lean_lib]]
name = "Solution"
roots = ["Solution"]

# The machine-checked equivalence of the constructed and characterised statements.
# Deliberately NOT a default target. This is a one-shot argument, not a living invariant:
# it imports only Challenge (hence Mathlib) and never touches OSforGFF, so no library
# change or re-pin can affect it. Build it on demand with `lake build StatementEquivalence`
# when the Challenge or the toolchain moves — that is, when the comparison is redone.
[[lean_lib]]
name = "StatementEquivalence"
roots = ["StatementEquivalence"]
